<title>Финес Студио · 10 3D-моделей (макет)</title>

<body>
<header class="hdr" id="top">
  <div class="wrap hdr__in">
    <a class="logo" href="https://finesstudio.ru/" aria-label="Финес Студио — на главную">
      <span class="logo__word">финес<span class="dot" aria-hidden="true"></span></span>
      <span class="logo__sub">студио</span>
    </a>
    <a class="btn btn--line hdr__cta" href="https://t.me/fines_studio" target="_blank" rel="noopener noreferrer">Оценить задачу<span class="arr" aria-hidden="true">↗</span></a>
  </div>
</header>
<main>
<section class="sec mpage" aria-labelledby="m-title">
  <div class="wrap">
    <div class="sh">
      <p class="label mono"><b>[3D]</b> Модели</p>
      <h2 id="m-title">Десять моделей <span class="w3">про нашу работу.</span></h2>
      <p class="sh__sub">Каждая написана кодом и запускается, только когда вы до неё долистали.</p>
    </div>
    <div class="mgrid">
      <figure class="mcard">
        <div class="mstage" data-m="plane" role="img" aria-label="3D-модель: бумажный самолёт"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">01</span>
          <span class="mcap__t">Telegram-бот</span>
          <span class="mcap__d">Запись, заявки и оплата в мессенджере, которым клиенты уже пользуются.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="chat" role="img" aria-label="3D-модель: два объёмных сообщения в диалоге"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">02</span>
          <span class="mcap__t">Ответы клиентам</span>
          <span class="mcap__d">Бот сам отвечает на типовые вопросы.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="funnel" role="img" aria-label="3D-модель: четыре сужающихся кольца с шариками"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">03</span>
          <span class="mcap__t">Воронка продаж</span>
          <span class="mcap__d">Видно, сколько заявок дошло до каждого этапа.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="kanban" role="img" aria-label="3D-модель: доска с карточками сделок"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">04</span>
          <span class="mcap__t">CRM</span>
          <span class="mcap__d">Каждая сделка на своём этапе, ничего не теряется.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="hub" role="img" aria-label="3D-модель: центральный куб, связанный с пятью узлами"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">05</span>
          <span class="mcap__t">Интеграции</span>
          <span class="mcap__d">Сайт, CRM, таблицы, 1С и мессенджеры обмениваются данными сами.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="lock" role="img" aria-label="3D-модель: замок"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">06</span>
          <span class="mcap__t">Защита</span>
          <span class="mcap__d">Защита сайтов и систем от DDoS-⁠атак.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="backup" role="img" aria-label="3D-модель: два хранилища из дисков"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">07</span>
          <span class="mcap__t">Резервные копии</span>
          <span class="mcap__d">Данные копируются во второе хранилище.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="site" role="img" aria-label="3D-модель: окно сайта, разложенное на слои"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">08</span>
          <span class="mcap__t">Сайты и веб-сервисы</span>
          <span class="mcap__d">Интерфейс под ваш процесс, а не готовая коробка.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="bars" role="img" aria-label="3D-модель: растущие столбцы"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">09</span>
          <span class="mcap__t">Отчёты</span>
          <span class="mcap__d">Цифры по заявкам и продажам в одном окне.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="pay" role="img" aria-label="3D-модель: банковская карта"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">10</span>
          <span class="mcap__t">Оплата</span>
          <span class="mcap__d">Приём оплаты в боте и на сайте.</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
</main>

<script src="assets/js/models.js?v=3" defer></script>
