<body>
<header class="hdr" id="top">
  <div class="wrap hdr__in">
    <a class="logo" href="https://finesstudio.ru/" aria-label="Финес Студио — на главную">
      <span class="logo__word">финес<span class="dot" aria-hidden="true"></span></span>
      <span class="logo__sub">студио</span>
    </a>
    <a class="btn btn--line hdr__cta" href="https://t.me/fines_studio" target="_blank" rel="noopener noreferrer">Оценить задачу<span class="arr" aria-hidden="true">↗</span></a>
  </div>

<main>
<section class="sec mpage" aria-labelledby="m-title">
  <div class="wrap">
    <div class="sh">
      <p class="label mono"><b>[3D]</b> Модели</p>
      <h2 id="m-title">Двадцать моделей <span class="w3">про нашу работу.</span></h2>
      <p class="sh__sub">Каждая написана кодом и запускается, только когда вы до неё долистали.</p>
    </div>
    <div class="mgrid">
      <figure class="mcard">
        <div class="mstage" data-m="plane" role="img" aria-label="3D-модель: бумажный самолёт на орбите"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">01</span>
          <span class="mcap__t">Telegram-бот</span>
          <span class="mcap__d">Запись, заявки и оплата в мессенджере, которым клиенты уже пользуются.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="chat" role="img" aria-label="3D-модель: сообщения в диалоге и кнопки ответа"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">02</span>
          <span class="mcap__t">Ответы клиентам</span>
          <span class="mcap__d">Бот сам отвечает на типовые вопросы.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="funnel" role="img" aria-label="3D-модель: воронка, по стенке которой скатываются шарики"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">03</span>
          <span class="mcap__t">Воронка продаж</span>
          <span class="mcap__d">Видно, сколько заявок дошло до каждого этапа.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="kanban" role="img" aria-label="3D-модель: доска с карточками сделок"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">04</span>
          <span class="mcap__t">CRM</span>
          <span class="mcap__d">Каждая сделка на своём этапе, ничего не теряется.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="hub" role="img" aria-label="3D-модель: центральный куб, связанный с пятью разными узлами"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">05</span>
          <span class="mcap__t">Интеграции</span>
          <span class="mcap__d">Сайт, CRM, таблицы, 1С и мессенджеры обмениваются данными сами.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="shield" role="img" aria-label="3D-модель: ядро под вращающимся щитом"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">06</span>
          <span class="mcap__t">Защита</span>
          <span class="mcap__d">Защита сайтов и систем от DDoS-⁠атак.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="backup" role="img" aria-label="3D-модель: два хранилища из дисков"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">07</span>
          <span class="mcap__t">Резервные копии</span>
          <span class="mcap__d">Данные копируются во второе хранилище.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="site" role="img" aria-label="3D-модель: окно сайта, разложенное на слои"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">08</span>
          <span class="mcap__t">Сайты и веб-сервисы</span>
          <span class="mcap__d">Интерфейс под ваш процесс, а не готовая коробка.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="bars" role="img" aria-label="3D-модель: растущие столбцы"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">09</span>
          <span class="mcap__t">Отчёты</span>
          <span class="mcap__d">Цифры по заявкам и продажам в одном окне.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="pay" role="img" aria-label="3D-модель: банковская карта и волны оплаты"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">10</span>
          <span class="mcap__t">Оплата</span>
          <span class="mcap__d">Приём оплаты в боте и на сайте.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="ai" role="img" aria-label="3D-модель: сеть из узлов с бегущими сигналами"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">11</span>
          <span class="mcap__t">ИИ-ассистент</span>
          <span class="mcap__d">Отвечает клиентам и сотрудникам по вашим данным.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="cal" role="img" aria-label="3D-модель: календарь с выбранным днём"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">12</span>
          <span class="mcap__t">Онлайн-запись</span>
          <span class="mcap__d">Клиент сам выбирает день и время.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="bell" role="img" aria-label="3D-модель: колокольчик"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">13</span>
          <span class="mcap__t">Напоминания</span>
          <span class="mcap__d">Бот напомнит о визите, оплате и продлении.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="gears" role="img" aria-label="3D-модель: три шестерни в зацеплении"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">14</span>
          <span class="mcap__t">Автоматизация</span>
          <span class="mcap__d">Рутинные действия выполняются без участия людей.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="doc" role="img" aria-label="3D-модель: стопка листов с печатью"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">15</span>
          <span class="mcap__t">Документы</span>
          <span class="mcap__d">Счета и договоры собираются по шаблону.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="devices" role="img" aria-label="3D-модель: экран и телефон с одним интерфейсом"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">16</span>
          <span class="mcap__t">Адаптив</span>
          <span class="mcap__d">Одинаково удобно на телефоне и компьютере.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="gauge" role="img" aria-label="3D-модель: прибор со стрелкой"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">17</span>
          <span class="mcap__t">Мониторинг</span>
          <span class="mcap__d">Узнаём о сбое раньше ваших клиентов.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="server" role="img" aria-label="3D-модель: три серверных блока"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">18</span>
          <span class="mcap__t">Хостинг и поддержка</span>
          <span class="mcap__d">Размещаем, обновляем и следим за работой.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="check" role="img" aria-label="3D-модель: чек-лист с галочками"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">19</span>
          <span class="mcap__t">Соответствие закону</span>
          <span class="mcap__d">Сайты и системы под требования законодательства.</span>
        </figcaption>
      </figure>
      <figure class="mcard">
        <div class="mstage" data-m="cube" role="img" aria-label="3D-модель: куб из восьми частей"></div>
        <figcaption class="mcap">
          <span class="mono mcap__n">20</span>
          <span class="mcap__t">3D и анимация</span>
          <span class="mcap__d">Модели и движение для вашего сайта.</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
