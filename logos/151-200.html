<h1>Финес Студио — логотипы 151–200</h1>
<p class="hint">Круги и орбиты (151–163), монограмма «ф» из кругов и стойки (164–175), иконки приложений и аватарки для Telegram (176–190), знак №93 в разных ролях (191–200).</p>
<div class="grid" id="g"></div>
<script>
const O='#f2501c',Y='#ffc21a',P='#ff4d8d',B='#2b6cff',V='#7b3cff',EM='#12a150',LM='#d4e600',G='#3fb950',INK='#1c1b19',L='#fbfaf7',D='#0d1117',K='#14161c',NV='#0a1628',BK='#0b0b12',CY='#22d3ee',CR='#f4f1ea',GY='#9a968c',MU='#7a766d';
const sub=(t,c,extra='')=>`<span class="sub" style="color:${c};${extra}">${t}</span>`;
const subl=(t,c)=>sub(t,c,'letter-spacing:.1em;text-transform:none;font-size:18px');
const typed=(t,n,extra='')=>`<span class="type" style="--w:${n}ch;animation-timing-function:steps(${n},end);${extra}">${t}</span>`;
/* точка из двух кругов (как №93) */
const pair=({a=O,b=Y,bl='multiply',an='spin 3s linear infinite',sz='.32em',ml='.14em',r=6,dx=3,vert=false,ca='',cb='',st='',ga=''}={})=>{
  const p1=vert?`cx="10" cy="${10-dx}"`:`cx="${10-dx}" cy="10"`,p2=vert?`cx="10" cy="${10+dx}"`:`cx="${10+dx}" cy="10"`;
  return `<svg viewBox="0 0 20 20" style="width:${sz};height:${sz};margin-left:${ml};overflow:visible;flex:none;${st}"><g style="transform-box:view-box;transform-origin:10px 10px;animation:${an};${ga}"><circle ${p1} r="${r}" fill="${a}" class="fb" style="mix-blend-mode:${bl};${ca}"/><circle ${p2} r="${r}" fill="${b}" class="fb" style="mix-blend-mode:${bl};${cb}"/></g></svg>`};
const word=(t,o={})=>`<div style="font:${o.f||'800 60px Onest'};letter-spacing:${o.ls||'-.06em'};color:${o.c||INK};display:flex;align-items:baseline;line-height:1.05;${o.st||''}">${t}${o.after||''}</div>`;
const ico=(bg,inner,extra='',sz=76,r=21)=>`<div style="width:${sz}px;height:${sz}px;border-radius:${r}px;background:${bg};display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex:none;${extra}">${inner}</div>`;
const av=(bg,inner,sz=88,extra='')=>`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex:none;${extra}">${inner}</div>`;
/* знак «ф»: два круга + вертикаль */
const fmark=({a=O,b=Y,stem=INK,bl='multiply',ca='',cb='',gs='',ss='',sz=64,r=15,op=1}={})=>`<svg class="m" viewBox="0 0 64 64" style="width:${sz}px;height:${sz}px"><g class="rot" style="${gs}"><circle cx="23" cy="32" r="${r}" fill="${a}" fill-opacity="${op}" class="fb" style="mix-blend-mode:${bl};${ca}"/><circle cx="41" cy="32" r="${r}" fill="${b}" fill-opacity="${op}" class="fb" style="mix-blend-mode:${bl};${cb}"/></g><rect x="29.5" y="6" width="5" height="52" rx="2.5" fill="${stem}" class="fb" style="${ss}"/></svg>`;
const X=[
/* ===== 4. круги, кольца, орбиты ===== */
['Две орбиты навстречу', L, `<div class="lg row" style="margin:0"><svg class="m" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="#ddd8cd" stroke-width="2"/><circle cx="32" cy="32" r="16" fill="none" stroke="#ddd8cd" stroke-width="2"/><g class="rot" style="animation:spin 4s linear infinite"><circle cx="59" cy="32" r="5" fill="${O}"/></g><g class="rot" style="animation:spinR 2.6s linear infinite"><circle cx="16" cy="32" r="4" fill="${INK}"/></g><circle cx="32" cy="32" r="5" fill="${O}"/></svg><div class="w"><span style="font:800 38px Onest;color:${INK};letter-spacing:-.045em">финес</span>${sub('студио',O)}</div></div>`],
['Атом: три эллипса', BK, `<div class="lg row" style="margin:0"><svg class="m" viewBox="0 0 64 64"><g fill="none" stroke-width="2.2"><ellipse cx="32" cy="32" rx="28" ry="10" stroke="${O}" class="rot" style="animation:spin 9s linear infinite"/><ellipse cx="32" cy="32" rx="28" ry="10" stroke="${Y}" class="rot" style="animation:spin60 9s linear infinite"/><ellipse cx="32" cy="32" rx="28" ry="10" stroke="${CY}" class="rot" style="animation:spin120 9s linear infinite"/></g><circle cx="32" cy="32" r="5" fill="${CR}"/></svg><div class="w"><span style="font:800 36px Onest;color:${CR};letter-spacing:-.045em">финес</span>${sub('студио',O)}</div></div><style>@keyframes spin60{from{transform:rotate(60deg)}to{transform:rotate(420deg)}}@keyframes spin120{from{transform:rotate(120deg)}to{transform:rotate(480deg)}}</style>`],
['Кольцо-индикатор загрузки', L, `<div class="lg row" style="margin:0"><svg class="m" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#e7e2d8" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" stroke="${O}" stroke-width="7" stroke-linecap="round" stroke-dasharray="164" style="--L:164;animation:pathIn 3.6s cubic-bezier(.6,0,.3,1) infinite" transform="rotate(-90 32 32)"/><circle cx="32" cy="32" r="8" fill="${INK}" class="fb" style="animation:pulse 1.8s ease-in-out infinite"/></svg><div class="w"><span style="font:800 38px Onest;color:${INK};letter-spacing:-.045em">финес</span>${sub('студио',O)}</div></div>`],
['Концентрические волны', NV, `<div class="lg row" style="margin:0"><svg class="m" viewBox="0 0 64 64"><circle cx="32" cy="32" r="12" fill="none" stroke="${CY}" stroke-width="2" class="fb" style="animation:ring 2.4s ease-out infinite"/><circle cx="32" cy="32" r="12" fill="none" stroke="${CY}" stroke-width="2" class="fb" style="animation:ring 2.4s .8s ease-out infinite"/><circle cx="32" cy="32" r="12" fill="none" stroke="${CY}" stroke-width="2" class="fb" style="animation:ring 2.4s 1.6s ease-out infinite"/><circle cx="32" cy="32" r="9" fill="${CY}"/></svg><div class="w"><span style="font:800 36px Manrope;color:#fff;letter-spacing:-.04em">финес</span>${sub('студио',CY)}</div></div>`],
['Солнечная система', BK, `<div class="lg row" style="margin:0"><svg class="m" viewBox="0 0 64 64" style="width:74px;height:74px"><circle cx="32" cy="32" r="30" fill="none" stroke="#2a2a38" stroke-width="1"/><circle cx="32" cy="32" r="20" fill="none" stroke="#2a2a38" stroke-width="1"/><circle cx="32" cy="32" r="9" fill="${O}" style="filter:drop-shadow(0 0 6px ${O})"/><g class="rot" style="animation:spin 3s linear infinite"><circle cx="52" cy="32" r="3.5" fill="${CY}"/></g><g class="rot" style="animation:spin 7s linear infinite"><circle cx="62" cy="32" r="4.5" fill="${Y}"/></g></svg><div class="w"><span style="font:300 38px Jost;color:${CR}">Финес</span>${sub('студио',O)}</div></div>`],
['Кольца сцепляются и расцепляются', L, `<div class="lg row" style="margin:0"><svg class="m" viewBox="0 0 64 64" style="width:76px"><circle cx="22" cy="32" r="15" fill="none" stroke="${O}" stroke-width="5" class="fb" style="--d:-8px;animation:split 4s cubic-bezier(.6,0,.3,1) infinite"/><circle cx="42" cy="32" r="15" fill="none" stroke="${INK}" stroke-width="5" class="fb" style="--d:8px;animation:split 4s cubic-bezier(.6,0,.3,1) infinite"/></svg><div class="w"><span style="font:800 36px Onest;color:${INK};letter-spacing:-.045em">финес</span>${sub('студио',O)}</div></div>`],
