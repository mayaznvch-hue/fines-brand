  case 'tech': return `<div class="wm" style="${base};font-weight:800;font-size:27px;text-transform:uppercase;letter-spacing:.02em"><b>${N}</b><i style="font-size:14px;font-weight:600;letter-spacing:.25em;color:${ac};margin-top:5px">${S.toUpperCase()}</i></div>`;
  case 'cond': return `<div class="wm" style="${base};font-weight:600;font-size:32px;text-transform:uppercase;letter-spacing:.04em"><b>${N}</b><i style="font-size:14px;font-weight:600;letter-spacing:.35em;color:${ac};margin-top:4px">${S.toUpperCase()}</i></div>`;
  case 'hand': return `<div class="wm" style="${base};font-weight:600;font-size:38px"><b>${N}</b><i style="font-family:Onest;font-size:15px;font-weight:600;color:${ac};margin-top:4px">${S.toLowerCase()}</i></div>`;
  case 'low': return `<div class="wm row" style="${base};font-weight:500;font-size:28px;letter-spacing:-.03em"><b>${N.toLowerCase()}</b><i style="font-weight:400;color:${ac}">${S.toLowerCase()}</i></div>`;
  case 'script': return `<div class="wm" style="align-items:center;${base}"><b style="font-size:58px;line-height:1.15">${N}</b><i style="font-family:Onest;font-weight:600;font-size:14px;letter-spacing:.45em;text-transform:uppercase;color:${ac};margin-top:8px;padding-left:.5em">${S}</i></div>`;
  case 'tilde': return `<div class="wm" style="align-items:center;${base}"><svg width="120" height="16" viewBox="0 0 120 16"><path d="M4 11C22-1 38 15 60 7s38-8 56 2" stroke="${ac}" stroke-width="3" fill="none" stroke-linecap="round"/></svg><b style="font-size:40px;font-weight:900;letter-spacing:-.04em;text-transform:uppercase;margin-top:4px">${N}</b><i style="font-size:13px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:${ac};margin-top:6px;padding-left:.42em">${S}</i></div>`;
  case 'serifdot': return `<div class="wm" style="align-items:center;${base}"><b style="font-size:52px;font-weight:800;letter-spacing:-.02em">${N}<span style="color:${ac}">.</span></b><i style="font-family:Onest;font-size:15px;font-weight:600;letter-spacing:.35em;text-transform:uppercase;color:${ac};margin-top:4px;padding-left:.35em">${S}</i></div>`;
  case 'lowdot': return `<div class="wm" style="align-items:flex-start;${base}"><b style="font-size:58px;font-weight:800;letter-spacing:-.06em">${N.toLowerCase()}<span style="color:${ac}">.</span></b><i style="font-size:18px;font-weight:600;color:${ac};margin-top:2px;padding-left:4px">${S.toLowerCase()}</i></div>`;
  case 'spaced': return `<div class="wm" style="align-items:center;${base}"><b style="font-size:36px;font-weight:500;letter-spacing:.3em;padding-left:.3em">ФИНЕС</b><span style="width:46px;height:2px;background:${ac};margin:12px 0"></span><i style="font-size:14px;font-weight:600;letter-spacing:.55em;padding-left:.55em;color:${ac}">СТУДИО</i></div>`;
  case 'block': return `<div style="display:flex;align-items:stretch;border-radius:8px;overflow:hidden;font-family:'${font}'"><div style="background:${fg};color:#fff;font-weight:800;font-size:26px;letter-spacing:.02em;padding:14px 16px">ФИНЕС</div><div style="background:${ac};color:#fff;font-family:Onest;font-weight:600;font-size:15px;letter-spacing:.12em;padding:0 14px;display:flex;align-items:center">СТУДИО</div></div>`;
 }};
const g=document.getElementById('g');
L.forEach((it,i)=>{const [idea,bg,fg,ac,font,mark,lay]=it;
  const c=document.createElement('div');c.className='c';c.id='L'+(i+1);c.style.background=bg;c.style.color=fg;
  const m=mark?`<svg class="m" viewBox="0 0 64 64">${mark(fg,ac,bg,i)}</svg>`:'';
  c.innerHTML=`<span class="n">${i+1}</span>`+(lay==='w'?`<div class="lg">${WM(it)}</div>`:`<div class="lg ${lay==='v'?'v':''}">${m}${WM(it)}</div>`)+`<span class="cap">${idea}</span>`;
  g.append(c);});
document.title+=' ('+L.length+')';
</script>
</body></html>
